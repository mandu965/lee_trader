x-python-runtime: &python-runtime
  image: lee_trader-python-runtime:latest
  build:
    context: .
    dockerfile: ./python/Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
  working_dir: /app
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
    TZ: Asia/Seoul

services:
  postgres:
    image: postgres:15
    container_name: lee_trader_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lee_trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lee_trader_pw}
      POSTGRES_DB: ${POSTGRES_DB:-lee_trader}
    ports:
      - "15432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/initdb.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lee_trader} -d ${POSTGRES_DB:-lee_trader}"]
      interval: 10s
      timeout: 5s
      retries: 5

  python-pipeline:
    <<: *python-runtime
    container_name: lee_trader_pipeline
    command: ["python", "python/run_pipeline.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      USE_SQLITE_MIRROR: ${USE_SQLITE_MIRROR:-0}
      USE_SQLITE_FALLBACK_WRITES: ${USE_SQLITE_FALLBACK_WRITES:-0}
      USE_KIS_UNIVERSE: ${USE_KIS_UNIVERSE:-0}
      RUN_PIPELINE_SKIP_FLOW_INGESTION: ${RUN_PIPELINE_SKIP_FLOW_INGESTION:-1}
      DART_REFRESH_RECENT_YEARS: ${DART_REFRESH_RECENT_YEARS:-1}

  scheduler:
    <<: *python-runtime
    container_name: lee_trader_scheduler
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./outputs:/app/outputs
      - ./serving:/app/serving
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      USE_SQLITE_MIRROR: ${USE_SQLITE_MIRROR:-0}
      USE_SQLITE_FALLBACK_WRITES: ${USE_SQLITE_FALLBACK_WRITES:-0}
      USE_KIS_UNIVERSE: ${USE_KIS_UNIVERSE:-0}
      RUN_PIPELINE_SKIP_FLOW_INGESTION: ${RUN_PIPELINE_SKIP_FLOW_INGESTION:-1}
      SCHEDULER_TIMEZONE: Asia/Seoul
      SCHEDULER_DAILY_TIME: ${SCHEDULER_DAILY_TIME:-18:10}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-30}
      SCHEDULER_SKIP_CATCHUP_ON_START: ${SCHEDULER_SKIP_CATCHUP_ON_START:-1}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_RUN_POLICY:-always}
      SCHEDULER_SKIP_AFTER_FAILURE_UNTIL_NEXT_DAY: ${SCHEDULER_SKIP_AFTER_FAILURE_UNTIL_NEXT_DAY:-1}

  scheduler-recovery:
    <<: *python-runtime
    container_name: lee_trader_scheduler_recovery
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./outputs:/app/outputs
      - ./serving:/app/serving
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      SCHEDULER_TIMEZONE: Asia/Seoul
      SCHEDULER_COMMAND_SET: intraday
      SCHEDULER_DAILY_TIME: ${SCHEDULER_RECOVERY_DAILY_TIME:-12:00}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_RECOVERY_POLL_SECONDS:-30}
      SCHEDULER_SKIP_CATCHUP_ON_START: ${SCHEDULER_RECOVERY_SKIP_CATCHUP_ON_START:-1}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_RECOVERY_RUN_POLICY:-always}
      SCHEDULER_STATUS_PATH: ${SCHEDULER_RECOVERY_STATUS_PATH:-outputs/auto_ops_recovery_scheduler_status.json}
      SCHEDULER_LOG_PATH: ${SCHEDULER_RECOVERY_LOG_PATH:-logs/auto_ops_recovery_scheduler.log}
      SCHEDULER_PRIMARY_STATUS_PATH: ${SCHEDULER_PRIMARY_STATUS_PATH:-outputs/auto_ops_scheduler_status.json}
      SCHEDULER_PRIMARY_MAX_AGE_HOURS: ${SCHEDULER_PRIMARY_MAX_AGE_HOURS:-20}

  scheduler-auto-buy:
    <<: *python-runtime
    container_name: lee_trader_scheduler_auto_buy
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./outputs:/app/outputs
      - ./serving:/app/serving
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      SCHEDULER_TIMEZONE: Asia/Seoul
      # Auto-buy selection policy is read from config/production_v1.yaml.
      # Current live policy: ranking_final top20 -> top8 basic review -> top9~10 extended review.
      SCHEDULER_COMMAND_SET: auto_buy
      SCHEDULER_DAILY_TIME: ${SCHEDULER_AUTO_BUY_DAILY_TIME:-09:30}
      SCHEDULER_DAILY_TIMES: ${SCHEDULER_AUTO_BUY_DAILY_TIMES:-09:30,10:00}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_AUTO_BUY_POLL_SECONDS:-30}
      SCHEDULER_SKIP_CATCHUP_ON_START: ${SCHEDULER_AUTO_BUY_SKIP_CATCHUP_ON_START:-1}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_AUTO_BUY_RUN_POLICY:-always}
      SCHEDULER_MULTI_SLOT_SUCCESS_POLICY: ${SCHEDULER_AUTO_BUY_MULTI_SLOT_SUCCESS_POLICY:-once_per_day}
      SCHEDULER_STATUS_PATH: ${SCHEDULER_AUTO_BUY_STATUS_PATH:-outputs/auto_ops_auto_buy_scheduler_status.json}
      SCHEDULER_LOG_PATH: ${SCHEDULER_AUTO_BUY_LOG_PATH:-logs/auto_ops_auto_buy_scheduler.log}
      AUTO_TRADE_EXECUTE: ${AUTO_TRADE_EXECUTE:-0}
      AUTO_TRADE_ALLOW_BUY: ${AUTO_TRADE_ALLOW_BUY:-0}
      AUTO_TRADE_BUY_APPROVAL_REQUIRED: ${AUTO_TRADE_BUY_APPROVAL_REQUIRED:-0}
      AUTO_TRADE_FORCE_RESUBMIT: ${AUTO_TRADE_FORCE_RESUBMIT:-0}
      AUTO_TRADE_SKIP_THEME_SHADOW: ${AUTO_TRADE_SKIP_THEME_SHADOW:-1}
      AUTO_TRADE_SKIP_PAPER_TRADING: ${AUTO_TRADE_SKIP_PAPER_TRADING:-1}
      AUTO_TRADE_SKIP_PAPER_TRADING_DB: ${AUTO_TRADE_SKIP_PAPER_TRADING_DB:-1}
      AUTO_TRADE_CONFIRM_TEXT: ${AUTO_TRADE_CONFIRM_TEXT:-}
      SCHEDULER_SKIP_AFTER_FAILURE_UNTIL_NEXT_DAY: ${SCHEDULER_AUTO_BUY_SKIP_AFTER_FAILURE_UNTIL_NEXT_DAY:-1}

  scheduler-live-account-sync:
    <<: *python-runtime
    container_name: lee_trader_scheduler_live_account_sync
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./outputs:/app/outputs
      - ./serving:/app/serving
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      SCHEDULER_TIMEZONE: Asia/Seoul
      SCHEDULER_COMMAND_SET: live_sync
      SCHEDULER_DAILY_TIMES: ${SCHEDULER_LIVE_SYNC_DAILY_TIMES:-10:00,14:00,18:00}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_LIVE_SYNC_POLL_SECONDS:-30}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_LIVE_SYNC_RUN_POLICY:-always}
      SCHEDULER_STATUS_PATH: ${SCHEDULER_LIVE_SYNC_STATUS_PATH:-outputs/auto_ops_live_account_sync_scheduler_status.json}
      SCHEDULER_LOG_PATH: ${SCHEDULER_LIVE_SYNC_LOG_PATH:-logs/auto_ops_live_account_sync_scheduler.log}

  scheduler-rule-after-close:
    <<: *python-runtime
    container_name: lee_trader_scheduler_rule_after_close
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./outputs:/app/outputs
      - ./serving:/app/serving
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      SCHEDULER_TIMEZONE: Asia/Seoul
      SCHEDULER_COMMAND_SET: rule_after_close
      SCHEDULER_DAILY_TIME: ${SCHEDULER_RULE_AFTER_CLOSE_DAILY_TIME:-18:00}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_RULE_AFTER_CLOSE_POLL_SECONDS:-30}
      SCHEDULER_SKIP_CATCHUP_ON_START: ${SCHEDULER_RULE_AFTER_CLOSE_SKIP_CATCHUP_ON_START:-1}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_RULE_AFTER_CLOSE_RUN_POLICY:-always}
      SCHEDULER_STATUS_PATH: ${SCHEDULER_RULE_AFTER_CLOSE_STATUS_PATH:-outputs/rule_after_close_scheduler_status.json}
      SCHEDULER_LOG_PATH: ${SCHEDULER_RULE_AFTER_CLOSE_LOG_PATH:-logs/rule_after_close_scheduler.log}
      RULE_TRADING_RUN_MODE: ${RULE_TRADING_RUN_MODE:-paper}

  scheduler-rule-before-open:
    <<: *python-runtime
    container_name: lee_trader_scheduler_rule_before_open
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./outputs:/app/outputs
      - ./serving:/app/serving
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      SCHEDULER_TIMEZONE: Asia/Seoul
      SCHEDULER_COMMAND_SET: rule_before_open
      SCHEDULER_DAILY_TIME: ${SCHEDULER_RULE_BEFORE_OPEN_DAILY_TIME:-08:55}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_RULE_BEFORE_OPEN_POLL_SECONDS:-30}
      SCHEDULER_SKIP_CATCHUP_ON_START: ${SCHEDULER_RULE_BEFORE_OPEN_SKIP_CATCHUP_ON_START:-1}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_RULE_BEFORE_OPEN_RUN_POLICY:-always}
      SCHEDULER_STATUS_PATH: ${SCHEDULER_RULE_BEFORE_OPEN_STATUS_PATH:-outputs/rule_before_open_scheduler_status.json}
      SCHEDULER_LOG_PATH: ${SCHEDULER_RULE_BEFORE_OPEN_LOG_PATH:-logs/rule_before_open_scheduler.log}
      RULE_TRADING_RUN_MODE: ${RULE_TRADING_RUN_MODE:-paper}

  scheduler-rule-after-open:
    <<: *python-runtime
    container_name: lee_trader_scheduler_rule_after_open
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./output:/app/output
      - ./outputs:/app/outputs
      - ./serving:/app/serving
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      SCHEDULER_TIMEZONE: Asia/Seoul
      SCHEDULER_COMMAND_SET: rule_after_open
      SCHEDULER_DAILY_TIME: ${SCHEDULER_RULE_AFTER_OPEN_DAILY_TIME:-09:10}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_RULE_AFTER_OPEN_POLL_SECONDS:-30}
      SCHEDULER_SKIP_CATCHUP_ON_START: ${SCHEDULER_RULE_AFTER_OPEN_SKIP_CATCHUP_ON_START:-1}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_RULE_AFTER_OPEN_RUN_POLICY:-always}
      SCHEDULER_STATUS_PATH: ${SCHEDULER_RULE_AFTER_OPEN_STATUS_PATH:-outputs/rule_after_open_scheduler_status.json}
      SCHEDULER_LOG_PATH: ${SCHEDULER_RULE_AFTER_OPEN_LOG_PATH:-logs/rule_after_open_scheduler.log}
      RULE_TRADING_RUN_MODE: ${RULE_TRADING_RUN_MODE:-paper}

  scheduler-us-macro:
    <<: *python-runtime
    container_name: lee_trader_scheduler_us_macro
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      SCHEDULER_TIMEZONE: Asia/Seoul
      SCHEDULER_COMMAND_SET: us_macro
      SCHEDULER_DAILY_TIME: ${SCHEDULER_US_MACRO_DAILY_TIME:-07:30}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_US_MACRO_POLL_SECONDS:-60}
      SCHEDULER_SKIP_CATCHUP_ON_START: ${SCHEDULER_US_MACRO_SKIP_CATCHUP_ON_START:-1}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_US_MACRO_RUN_POLICY:-always}
      SCHEDULER_STATUS_PATH: ${SCHEDULER_US_MACRO_STATUS_PATH:-outputs/us_macro_scheduler_status.json}
      SCHEDULER_LOG_PATH: ${SCHEDULER_US_MACRO_LOG_PATH:-logs/us_macro_scheduler.log}
      SCHEDULER_FAIL_ON_RUNTIME_ASSET_ISSUES: "0"
      US_MACRO_ENABLED: ${US_MACRO_ENABLED:-1}
      US_MACRO_SHADOW_MODE: ${US_MACRO_SHADOW_MODE:-1}
      US_MACRO_DATA_SOURCE: ${US_MACRO_DATA_SOURCE:-yfinance}
      US_MACRO_ALLOW_REAL_APPLY: "0"
      US_MACRO_SCHEDULER_LOOKBACK_DAYS: ${US_MACRO_SCHEDULER_LOOKBACK_DAYS:-2}

  scheduler-us-macro-shadow:
    <<: *python-runtime
    container_name: lee_trader_scheduler_us_macro_shadow
    restart: unless-stopped
    command: ["python", "python/run_daily_scheduler.py"]
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
      SCHEDULER_TIMEZONE: Asia/Seoul
      SCHEDULER_COMMAND_SET: us_macro_shadow
      SCHEDULER_DAILY_TIME: ${SCHEDULER_US_MACRO_SHADOW_DAILY_TIME:-08:50}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_US_MACRO_SHADOW_POLL_SECONDS:-60}
      SCHEDULER_SKIP_CATCHUP_ON_START: ${SCHEDULER_US_MACRO_SHADOW_SKIP_CATCHUP_ON_START:-1}
      SCHEDULER_RUN_POLICY: ${SCHEDULER_US_MACRO_SHADOW_RUN_POLICY:-always}
      SCHEDULER_STATUS_PATH: ${SCHEDULER_US_MACRO_SHADOW_STATUS_PATH:-outputs/us_macro_shadow_scheduler_status.json}
      SCHEDULER_LOG_PATH: ${SCHEDULER_US_MACRO_SHADOW_LOG_PATH:-logs/us_macro_shadow_scheduler.log}
      SCHEDULER_FAIL_ON_RUNTIME_ASSET_ISSUES: "0"
      US_MACRO_ENABLED: ${US_MACRO_ENABLED:-1}
      US_MACRO_SHADOW_MODE: ${US_MACRO_SHADOW_MODE:-1}
      US_MACRO_ALLOW_REAL_APPLY: "0"

  node-api:
    build:
      context: .
      dockerfile: ./node/Dockerfile
    container_name: lee_trader_api
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app
    command: ["npm", "run", "start"]
    ports:
      - "3400:3000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./serving:/app/serving
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql://lee_trader:lee_trader_pw@postgres:5432/lee_trader}
      TZ: Asia/Seoul
