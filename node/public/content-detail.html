  <link rel="stylesheet" href="/site.css">
</head>
<body class="site-body" data-slug="">
  <header class="site-header">
    <div class="site-container site-header__inner">
      <a class="site-brand" href="/">
        <div class="site-brand__mark">LT</div>
        <div>
          <p class="site-brand__title">Lee Trader Lab</p>
          <p class="site-brand__subtitle">국내 주식 운영 해석과 시장 브리프</p>
        </div>
      </a>
      <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="siteNav">메뉴</button>
      <nav id="siteNav" class="site-nav">
        <span class="site-nav__section">둘러보기</span>
        <a href="/">홈</a>
        <a href="/about">소개</a>
        <a href="/methodology">방법론</a>
        <a href="/glossary">용어 해설</a>
        <a href="/operator-note">운영 안내</a>
        <span class="site-nav__section">콘텐츠</span>
        <a id="detailNavReports" href="/reports">시장 해설</a>
        <a id="detailNavBlog" href="/blog">블로그</a>
        <span class="site-nav__section">바로가기</span>
        <a class="site-nav__app" href="/operator-note">운영 안내</a>
        <a class="site-nav__minor" href="/contact">문의</a>
      </nav>
    </div>
  </header>
  <main class="site-main">
    <div class="site-container">
      <nav class="detail-breadcrumb" id="detailBreadcrumb" aria-label="breadcrumb"></nav>
      <div class="content-layout">
        <div id="articleDetail"></div>
        <aside class="detail-sidebar">
          <section class="side-panel side-panel--highlight">
            <h3>글 요약</h3>
            <p id="articleSummaryText">게시글 요약을 불러오는 중입니다.</p>
          </section>
          <section class="side-panel">
            <h3>글 정보</h3>
            <ul id="articleMeta"></ul>
          </section>
          <section class="side-panel">
            <h3>같이 읽을 글</h3>
            <ul id="relatedList"></ul>
          </section>
          <section class="side-panel">
            <h3>바로 가기</h3>
            <ul>
              <li><a class="text-link" href="/methodology">방법론 읽기</a></li>
              <li><a class="text-link" href="/glossary">용어 해설 보기</a></li>
              <li><a class="text-link" href="/about">회사 소개 보기</a></li>

            </ul>
          </section>
        </aside>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="site-container site-footer__inner">
      <div>Lee Trader Lab · 설명 중심 국내 주식 정보 플랫폼</div>
      <div>
        <a class="text-link" href="/privacy">개인정보처리방침</a>
        ·
        <a class="text-link" href="/terms">이용약관</a>
        ·
        <a class="text-link" href="/disclaimer">면책조항</a>
      </div>
    </div>
  </footer>
  <script src="/site-library.js"></script>
  <script src="/site-shell.js"></script>
  <script src="/site-app.js"></script>
  <script>
    (async function () {
      const parts = location.pathname.split("/").filter(Boolean);
      const slug = parts[1] || "";
      document.body.dataset.slug = slug;
      if (parts[0] === "reports") {
        document.getElementById("detailNavReports").classList.add("is-active");
      } else {
        document.getElementById("detailNavBlog").classList.add("is-active");
      }
      const items = await (window.SiteLibraryReady || Promise.resolve(Array.isArray(window.SiteLibrary) ? window.SiteLibrary : []));
      const item = (Array.isArray(items) ? items : []).find((entry) => entry.slug === slug);
      if (item) document.title = `${item.title} | Lee Trader Lab`;
    })();
  </script>
</body>
</html>
