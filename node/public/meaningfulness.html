<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 성과</title>
  <link rel="stylesheet" href="./styles.css?v=20260525-ops-nav">
  <style>
    .nav-shell,
    .page-wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 0; }
    .page-wrap { padding-bottom: 60px; }
    .nav-panel {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 16px;
    }
    .nav-panel .snav {
      padding: 0;
      border-bottom: none;
      margin-bottom: 0;
    }

    .hero-section {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .hero-section h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; }
    .hero-section p { margin: 0; font-size: 13px; color: var(--color-text-secondary); }

    .panel {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 15px; font-weight: 700; margin: 0 0 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .panel-title .kicker {
      font-size: 10px; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--color-text-secondary);
      background: rgba(255,255,255,0.06); border-radius: 4px; padding: 2px 7px;
    }

    /* Gate/Walkforward status grid */
    .status-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 14px;
    }
    .status-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
    }
    .status-card__label {
      font-size: 11px; color: var(--color-text-secondary);
      text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px;
    }
    .status-card__value {
      font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
    }
    .status-card__sub { font-size: 11px; color: var(--color-text-secondary); margin-top: 4px; }

    .badge {
      display: inline-block; padding: 3px 10px; border-radius: var(--radius-pill);
      font-size: 11px; font-weight: 700; letter-spacing: 0.05em;
    }
    .badge--pilot { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .badge--buy-allowed { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .badge--suspended { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .badge--rejected { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
    .badge--conditional { background: rgba(251,191,36,0.15); color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); }
    .badge--accepted { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
    .badge--default { background: rgba(148,163,184,0.12); color: #94a3b8; border: 1px solid rgba(148,163,184,0.2); }

    .reason-pills { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .reason-pill {
      font-size: 11px; padding: 3px 9px; border-radius: var(--radius-pill);
      background: rgba(248,113,113,0.1); color: #f87171;
      border: 1px solid rgba(248,113,113,0.2);
    }

    .maturation-bar {
      margin-top: 12px; padding: 12px 16px;
      background: rgba(255,255,255,0.03); border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }
    .maturation-bar__label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 8px; }
    .maturation-bar__track {
      height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .maturation-bar__fill {
      height: 100%; border-radius: 3px;
      background: linear-gradient(90deg, #3b82f6 0%, #22c55e 100%);
      transition: width 0.4s ease;
    }
    .maturation-bar__meta {
      display: flex; justify-content: space-between;
      font-size: 11px; color: var(--color-text-secondary); margin-top: 5px;
    }

    /* Performance section */
    .controls-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .controls-row label { font-size: 12px; color: var(--color-text-secondary); }
    .controls-row input[type="date"] {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--color-text-primary);
      padding: 7px 12px; font-size: 13px; font-family: inherit;
    }
    .controls-row input[type="number"] {
      background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: var(--radius-md); color: var(--color-text-primary);
      padding: 7px 12px; font-size: 13px; font-family: inherit; width: 70px;
    }
    .btn {
      padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid var(--border);
      background: rgba(255,255,255,0.07); color: var(--color-text-primary);
      font-size: 13px; font-family: inherit; cursor: pointer; transition: background 0.15s;
    }
    .btn:hover { background: rgba(255,255,255,0.12); }
    .btn--primary {
      background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.35); color: #22c55e;
    }
    .btn--primary:hover { background: rgba(34,197,94,0.25); }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px; margin-bottom: 16px;
    }
    .stat-card {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border);
      border-radius: var(--radius-md); padding: 12px 14px; text-align: center;
    }
    .stat-card__label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
    .stat-card__value { font-size: 20px; font-weight: 700; }

    /* Outcomes table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      padding: 9px 10px; text-align: left;
      font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
      color: var(--color-text-secondary); text-transform: uppercase;
      border-bottom: 1px solid var(--border);
    }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.12s; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    tbody td { padding: 9px 10px; vertical-align: middle; }
    .td-rank { font-weight: 700; color: var(--color-text-secondary); width: 36px; }
    .td-code { font-size: 11px; color: var(--color-text-secondary); }
    .td-name { font-weight: 600; }
    .td-score { font-weight: 700; }

    .ret { font-weight: 700; font-size: 13px; }
    .ret--pos { color: #22c55e; }
    .ret--neg { color: #f87171; }
    .ret--zero { color: var(--color-text-secondary); }

    .days-badge {
      display: inline-block; padding: 2px 7px; border-radius: 4px;
      font-size: 11px; font-weight: 600;
      background: rgba(96,165,250,0.12); color: #60a5fa;
    }

    .loading { text-align: center; padding: 40px; color: var(--color-text-secondary); font-size: 14px; }
    .empty { text-align: center; padding: 32px; color: var(--color-text-secondary); font-size: 13px; }
    .error-msg { color: #f87171; font-size: 13px; padding: 12px; }

    .transition-note {
      font-size: 12px; color: var(--color-text-secondary); margin-top: 10px;
      padding: 10px 14px; background: rgba(59,130,246,0.08);
      border: 1px solid rgba(59,130,246,0.2); border-radius: var(--radius-md);
      line-height: 1.6;
    }
    .sample-note {
      margin: 0 0 14px;
      padding: 12px 14px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(251,191,36,0.25);
      background: rgba(251,191,36,0.08);
      color: #fde68a;
      font-size: 12px;
      line-height: 1.55;
    }
    .sample-note--ok {
      border-color: rgba(34,197,94,0.25);
      background: rgba(34,197,94,0.08);
      color: #86efac;
    }
</style>
</head>
<body>
<div class="nav-shell">
  <div class="nav-panel" data-unified-ops-nav data-nav-active="meaningfulness"></div>
</div>
<div class="page-wrap">

  <div class="hero-section">
    <h1>AI 성과</h1>
    <p>Gate·Walkforward 성숙도 현황과 AI Top-N 예측이 실제로 맞는지 날짜별로 추적합니다.</p>
  </div>

  <!-- 시스템 성숙도 -->
  <div class="panel" id="gateSection">
    <div class="panel-title">
      <span class="kicker">System Maturity</span>
      시스템 성숙도
    </div>
    <div id="gateContent"><div class="loading">로딩 중…</div></div>
  </div>

  <!-- AI 예측 성과 -->
  <div class="panel">
    <div class="panel-title">
      <span class="kicker">Prediction Performance</span>
      AI 예측 성과
    </div>
    <div class="controls-row">
      <label>기준일</label>
      <input type="date" id="perfDate" onchange="loadPerformance()" />
      <label>Top</label>
      <input type="number" id="topN" value="20" min="5" max="50" onchange="loadPerformance()" />
    </div>
    <div id="perfStats"></div>
    <div id="perfTable"></div>
  </div>

</div>

<script src="./ops-unified-nav.js?v=20260527-nav-unified"></script>
<script>
const WF_REASON_MAP = {
  top20_excess_return_positive: "상위20 초과수익 미달",
  ordering_not_stable: "순위 안정성 부족",
  drawdown_too_deep: "최대낙폭 과도",
  confidence_monotonicity_missing: "신뢰도 단조성 미확인",
  execution_evidence_ok_or_unavailable: "실거래 증거 불충분",
  data_insufficient: "데이터 부족",
  matured_dates_insufficient: "만기 날짜 부족",
};

function fmtPct(v) {
  if (v == null || !isFinite(v)) return "—";
  const sign = v >= 0 ? "+" : "";
  return sign + (v * 100).toFixed(2) + "%";
}

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, m => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;",
  }[m]));
}

function retClass(v) {
  if (v == null || !isFinite(v)) return "ret--zero";
  if (v > 0.001) return "ret--pos";
  if (v < -0.001) return "ret--neg";
  return "ret--zero";
}

function gateBadge(status) {
  if (!status) return `<span class="badge badge--default">—</span>`;
  const s = status.toUpperCase();
  if (s === "PILOT") return `<span class="badge badge--pilot">PILOT</span>`;
  if (s === "BUY_ALLOWED") return `<span class="badge badge--buy-allowed">BUY_ALLOWED</span>`;
  if (s === "SUSPENDED") return `<span class="badge badge--suspended">SUSPENDED</span>`;
  return `<span class="badge badge--default">${status}</span>`;
}

function wfBadge(status) {
  if (!status) return `<span class="badge badge--default">—</span>`;
  const s = status.toUpperCase();
  if (s === "REJECTED") return `<span class="badge badge--rejected">REJECTED</span>`;
  if (s === "CONDITIONAL") return `<span class="badge badge--conditional">CONDITIONAL</span>`;
  if (s === "ACCEPTED") return `<span class="badge badge--accepted">ACCEPTED</span>`;
  return `<span class="badge badge--default">${status}</span>`;
}

async function loadGateStatus() {
  const el = document.getElementById("gateContent");
  try {
    const res = await fetch("/api/ai-gate-status");
    if (!res.ok) throw new Error("api error " + res.status);
    const g = await res.json();

    const maturedMax = g.benchmark_matured_dates_max ?? 0;
    const MATURITY_TARGET = 90; // 60d+buffer to reach ACCEPTED
    const maturityPct = Math.min(100, Math.round((maturedMax / MATURITY_TARGET) * 100));

    const reasonPills = (g.walkforward_reason_codes || []).map(code =>
      `<span class="reason-pill">${WF_REASON_MAP[code] || code}</span>`
    ).join("");

    el.innerHTML = `
      <div class="status-grid">
        <div class="status-card">
          <div class="status-card__label">Gate 상태</div>
          <div class="status-card__value">${gateBadge(g.gate_status)}</div>
          <div class="status-card__sub">기준일 ${g.asof_date || "—"}</div>
        </div>
        <div class="status-card">
          <div class="status-card__label">Walkforward</div>
          <div class="status-card__value">${wfBadge(g.walkforward_status)}</div>
          <div class="status-card__sub">ACCEPTED 시 Gate 자동 전환</div>
        </div>
        <div class="status-card">
          <div class="status-card__label">60d 만기 누적</div>
          <div class="status-card__value" style="font-size:22px;">${maturedMax}</div>
          <div class="status-card__sub">기준 ${MATURITY_TARGET}일 대비 ${maturityPct}%</div>
        </div>
        <div class="status-card">
          <div class="status-card__label">매수 가능 / Paper</div>
          <div class="status-card__value" style="font-size:18px;">
            <span style="color:#22c55e">${g.buy_now_count ?? "—"}</span>
            <span style="color:var(--color-text-secondary); font-size:14px"> / ${g.paper_only_count ?? "—"}</span>
          </div>
          <div class="status-card__sub">차단 ${g.blocked_count ?? "—"} · 관찰 ${g.watchlist_count ?? "—"}</div>
        </div>
      </div>
      ${reasonPills ? `
        <div style="font-size:11px; color:var(--color-text-secondary); margin-bottom:5px;">Walkforward REJECTED 사유</div>
        <div class="reason-pills">${reasonPills}</div>
      ` : ""}
      <div class="maturation-bar">
        <div class="maturation-bar__label">60d 성숙도 진행</div>
        <div class="maturation-bar__track">
          <div class="maturation-bar__fill" style="width:${maturityPct}%"></div>
        </div>
        <div class="maturation-bar__meta">
          <span>운영 시작: 2026-03-29</span>
          <span>${maturedMax} / ${MATURITY_TARGET} dates matured</span>
          <span>60d 만기 시작: 2026-05-28</span>
        </div>
      </div>
      <div class="transition-note">
        2026-05-28 이후 60d 만기 데이터가 쌓이면 Walkforward 통과 조건이 충족되고
        Gate가 PILOT → BUY_ALLOWED로 자동 전환됩니다. 코드 수정 불필요.
        현재 REJECTED 사유는 데이터 부족이 원인이며 모델 고장이 아닙니다.
      </div>
    `;
    return g;
  } catch (e) {
    el.innerHTML = `<div class="error-msg">Gate 상태 로드 실패: ${e.message}</div>`;
    return null;
  }
}

async function loadPerformance() {
  const dateVal = document.getElementById("perfDate").value;
  const topN = parseInt(document.getElementById("topN").value) || 20;
  const statsEl = document.getElementById("perfStats");
  const tableEl = document.getElementById("perfTable");

  if (!dateVal) {
    tableEl.innerHTML = `<div class="empty">날짜를 선택하세요.</div>`;
    return;
  }

  statsEl.innerHTML = "";
  tableEl.innerHTML = `<div class="loading">랭킹 데이터 조회 중…</div>`;

  try {
    // Prefer the curated payload when the selected date matches its analysis date.
    const meaningRes = await fetch("/api/top20-meaningfulness");
    if (meaningRes.ok) {
      const meaningData = await meaningRes.json();
      const payloadDate = String(
        meaningData?.meta?.analysis_date ||
        meaningData?.meta?.latest_date_in_file ||
        ""
      ).trim();
      if (payloadDate && payloadDate === dateVal && Array.isArray(meaningData?.rows) && meaningData.rows.length) {
        const merged = meaningData.rows.slice(0, topN).map((row, index) => ({
          rank: index + 1,
          code: String(row.code || "").trim(),
          name: row.name || row.code || "",
          final_score: row.final_score_v3 ?? row.final_score ?? row.score ?? null,
          outcome: null,
        }));

        const codes = merged.map(r => r.code).filter(Boolean);
        const outRes = await fetch("/api/meaningfulness-outcomes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ analysis_date: dateVal, codes }),
        });
        if (!outRes.ok) throw new Error("성과 API 오류 " + outRes.status);
        const outData = await outRes.json();
        const outcomeMap = new Map((outData.rows || []).map(r => [r.code, r]));
        const rowsWithOutcome = merged.map(r => ({
          ...r,
          outcome: outcomeMap.get(r.code) || null,
        }));

        renderStats(rowsWithOutcome, statsEl);
        renderTable(rowsWithOutcome, tableEl);
        return;
      }
    }

    // 1) Get ranking for the date
    const rankRes = await fetch(`/api/ranking?date=${dateVal}`);
    if (!rankRes.ok) throw new Error("랭킹 API 오류 " + rankRes.status);
    const rankData = await rankRes.json();
    const rows = Array.isArray(rankData.rows) ? rankData.rows : (Array.isArray(rankData) ? rankData : []);

    // Sort by rank (ascending) and take top N
    const sorted = rows
      .filter(r => r.rank != null || r.final_score != null)
      .sort((a, b) => {
        const ra = a.rank ?? 9999, rb = b.rank ?? 9999;
        if (ra !== rb) return ra - rb;
        return (b.final_score || 0) - (a.final_score || 0);
      })
      .slice(0, topN);

    if (!sorted.length) {
      tableEl.innerHTML = `<div class="empty">${dateVal} 기준 랭킹 데이터가 없습니다.</div>`;
      return;
    }

    tableEl.innerHTML = `<div class="loading">성과 데이터 조회 중 (${sorted.length}종목)…</div>`;

    // 2) Get outcomes
    const codes = sorted.map(r => String(r.code || "").trim()).filter(Boolean);
    const outRes = await fetch("/api/meaningfulness-outcomes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ analysis_date: dateVal, codes }),
    });
    if (!outRes.ok) throw new Error("성과 API 오류 " + outRes.status);
    const outData = await outRes.json();
    const outcomeMap = new Map((outData.rows || []).map(r => [r.code, r]));

    // 3) Merge and render
    const merged = sorted.map(r => ({
      ...r,
      outcome: outcomeMap.get(String(r.code || "").trim()) || null,
    }));

    renderStats(merged, statsEl);
    renderTable(merged, tableEl);

  } catch (e) {
    statsEl.innerHTML = "";
    tableEl.innerHTML = `<div class="error-msg">오류: ${e.message}</div>`;
  }
}

function renderStats(rows, el) {
  const withOutcome = rows.filter(r => r.outcome && r.outcome.latest_return != null);
  if (!withOutcome.length) { el.innerHTML = ""; return; }

  const rets = withOutcome.map(r => r.outcome.latest_return);
  const hitCount = rets.filter(v => v > 0).length;
  const hitRate = hitCount / rets.length;
  const avgRet = rets.reduce((a, b) => a + b, 0) / rets.length;
  const peakRets = withOutcome.map(r => r.outcome.peak_return).filter(v => v != null);
  const avgPeak = peakRets.length ? peakRets.reduce((a, b) => a + b, 0) / peakRets.length : null;
  const troughRets = withOutcome.map(r => r.outcome.trough_return).filter(v => v != null);
  const avgTrough = troughRets.length ? troughRets.reduce((a, b) => a + b, 0) / troughRets.length : null;
  const maxDays = Math.max(...withOutcome.map(r => r.outcome.observed_days || 0));
  const matured60 = withOutcome.filter(r => (r.outcome.observed_days || 0) >= 60).length;
  const matured20 = withOutcome.filter(r => (r.outcome.observed_days || 0) >= 20).length;
  const sampleReady = matured60 >= Math.min(10, withOutcome.length);
  const sampleNote = sampleReady
    ? `60일 이상 관찰 ${matured60}종목입니다. 평균 성과를 참고 지표로 볼 수 있습니다.`
    : `현재 최대 관찰 ${maxDays}일입니다. 20일 이상 ${matured20}종목, 60일 이상 ${matured60}종목이라 아직 성과 판정이 아니라 추적 상태로 보는 구간입니다.`;

  el.innerHTML = `
    <div class="sample-note ${sampleReady ? "sample-note--ok" : ""}">
      ${esc(sampleNote)}
    </div>
    <div class="stats-row">
      <div class="stat-card">
        <div class="stat-card__label">표본 상태</div>
        <div class="stat-card__value ${sampleReady ? 'ret--pos' : 'ret--zero'}" style="font-size:16px;">${sampleReady ? "참고 가능" : "판단 보류"}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">히트율 (양수수익)</div>
        <div class="stat-card__value ${hitRate >= 0.5 ? 'ret--pos' : 'ret--neg'}">${Math.round(hitRate * 100)}%</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">평균 수익률</div>
        <div class="stat-card__value ${retClass(avgRet)}">${fmtPct(avgRet)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">평균 최고 수익률</div>
        <div class="stat-card__value ret--pos">${fmtPct(avgPeak)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">평균 최저 수익률</div>
        <div class="stat-card__value ret--neg">${fmtPct(avgTrough)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-card__label">관찰 종목 / 기간</div>
        <div class="stat-card__value" style="font-size:16px;">${withOutcome.length}<span style="font-size:12px; color:var(--color-text-secondary)"> / ${maxDays}일</span></div>
      </div>
    </div>
  `;
}

function renderTable(rows, el) {
  if (!rows.length) {
    el.innerHTML = `<div class="empty">표시할 성과 데이터가 없습니다.</div>`;
    return;
  }
  const tbody = rows.map((r, i) => {
    const o = r.outcome;
    const rank = r.rank ?? (i + 1);
    const code = String(r.code || "");
    const name = r.name || code;
    const score = r.final_score != null ? Number(r.final_score).toFixed(1) : "—";
    const latRet = o?.latest_return;
    const peakRet = o?.peak_return;
    const troughRet = o?.trough_return;
    const obsDays = o?.observed_days;
    const latestDate = o?.latest_date || "—";

    return `
      <tr>
        <td class="td-rank">${rank}</td>
        <td><div class="td-name">${esc(name)}</div><div class="td-code">${esc(code)}</div></td>
        <td class="td-score">${score}</td>
        <td class="${obsDays >= 60 ? 'ret--pos' : ''}">${obsDays != null ? `<span class="days-badge">${obsDays}일</span>` : "—"}</td>
        <td><span class="ret ${retClass(latRet)}">${fmtPct(latRet)}</span><div style="font-size:10px;color:var(--color-text-secondary);margin-top:2px">${latestDate}</div></td>
        <td><span class="ret ret--pos">${fmtPct(peakRet)}</span></td>
        <td><span class="ret ret--neg">${fmtPct(troughRet)}</span></td>
      </tr>
    `;
  }).join("");

  el.innerHTML = `
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>순위</th>
            <th>종목</th>
            <th>점수</th>
            <th>관찰</th>
            <th>현재 수익률</th>
            <th>최고 도달</th>
            <th>최저 도달</th>
          </tr>
        </thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>
  `;
}

// Init
(async () => {
  const gate = await loadGateStatus();
  const dateInput = document.getElementById("perfDate");

  try {
    const meaningRes = await fetch("/api/top20-meaningfulness");
    if (meaningRes.ok) {
      const meaningData = await meaningRes.json();
      const payloadDate = String(
        meaningData?.meta?.analysis_date ||
        meaningData?.meta?.latest_date_in_file ||
        ""
      ).trim();
      if (payloadDate) {
        dateInput.value = payloadDate;
        dateInput.max = payloadDate;
      }
    }
  } catch (e) {
    // Fall through to ranking latest lookup below.
  }

  if (!dateInput.value) {
    try {
      const rankRes = await fetch("/api/ranking");
      if (rankRes.ok) {
        const rankData = await rankRes.json();
        const latestDate = Array.isArray(rankData?.rows) && rankData.rows.length
          ? String(rankData.rows[0].date || "").slice(0, 10)
          : (Array.isArray(rankData) && rankData.length ? String(rankData[0].date || "").slice(0, 10) : "");
        if (latestDate) {
          dateInput.value = latestDate;
          dateInput.max = latestDate;
        }
      }
    } catch (e) {
      // Ignore and fall through to client-side date default.
    }
  }

  if (!dateInput.value) {
    const fmt = d => d.toISOString().slice(0, 10);
    const today = new Date();
    dateInput.value = fmt(today);
    dateInput.max = fmt(today);
  }

  loadPerformance();
})();
</script>
