name: Close Batch

on:
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:
    inputs:
      execution_mode:
        description: "runtime_snapshot=restore local runtime outputs, pipeline=recompute"
        required: false
        default: "runtime_snapshot"
        type: choice
        options:
          - runtime_snapshot
          - pipeline

permissions:
  contents: read

concurrency:
  group: lee-trader-close-batch
  cancel-in-progress: false

jobs:
  close-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      MARKET_TIMEZONE: Asia/Seoul
      USE_KIS_UNIVERSE: "0"
      RUN_PIPELINE_SKIP_FLOW_INGESTION: "1"
      DART_REFRESH_RECENT_YEARS: "1"
      DART_CHECKPOINT_EVERY: "100"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NAVER_FALLBACK_VERIFY_SSL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve execution mode
        run: |
          MODE="runtime_snapshot"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.execution_mode }}" ]; then
            MODE="${{ github.event.inputs.execution_mode }}"
          fi
          echo "LEE_EXECUTION_MODE=$MODE" >> "$GITHUB_ENV"
          echo "Resolved execution mode: $MODE"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python/requirements.txt

      - name: Restore scheduler state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/dart
            data/fundamentals.csv
            data/prices_daily_raw.csv
            data/prices_daily_clean.csv
            data/prices_daily_adjusted.csv
            data/features.csv
            data/labels.csv
            data/universe.csv
            data/ranking_snapshot_archive.csv
            data/live_account_holdings.csv
            data/paper_trading_nav.csv
            data/score_kpi_monitor.json
            data/confidence_score_v2.json
            outputs/auto_ops_scheduler_status.json
            outputs/auto_ops_recovery_scheduler_status.json
            serving
          key: ${{ runner.os }}-lee-trader-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-lee-trader-state-

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python packages
        run: python -m pip install --upgrade pip && pip install -r python/requirements.txt

      - name: Restore git-safe snapshot fallback
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          import subprocess
          import sys

          root = Path(".").resolve()
          backups = sorted((root / "backups").glob("git_restore_backup_*.zip"))
          if not backups:
              print("No git restore backup zip found under backups/. Skipping snapshot restore.")
              raise SystemExit(0)

          latest = backups[-1]
          checks = [
              ("data/prices_daily_adjusted.csv", 100000, "2024-01-01"),
              ("data/features.csv", 100000, "2024-01-01"),
              ("data/labels.csv", 50000, "2024-01-01"),
          ]

          restore_reasons = []
          for rel_path, min_rows, max_min_date in checks:
              path = root / rel_path
              if not path.exists():
                  restore_reasons.append(f"{rel_path}: missing")
                  continue

              rows = 0
              min_date = None
              with path.open("r", encoding="utf-8-sig", newline="") as fh:
                  reader = csv.DictReader(fh)
                  for row in reader:
                      rows += 1
                      date_value = (row.get("date") or "").strip()
                      if date_value and (min_date is None or date_value < min_date):
                          min_date = date_value

              print(f"Pre-restore check {rel_path}: rows={rows}, min_date={min_date}")
              if rows < min_rows:
                  restore_reasons.append(f"{rel_path}: rows {rows} < {min_rows}")
              if not min_date:
                  restore_reasons.append(f"{rel_path}: min_date missing")
              elif min_date > max_min_date:
                  restore_reasons.append(
                      f"{rel_path}: min_date {min_date} is later than {max_min_date}"
                  )

          if restore_reasons:
              print(f"Restoring from {latest.name} because:")
              for reason in restore_reasons:
                  print(f" - {reason}")
              subprocess.run(
                  [sys.executable, "python/restore_csv_md_zip.py", "--zip", str(latest), "--overwrite"],
                  check=True,
              )
          else:
              print("Key CSVs already satisfy history requirements. Snapshot restore not required.")
          PY

      - name: Restore runtime snapshot
        if: ${{ env.LEE_EXECUTION_MODE == 'runtime_snapshot' }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          root = Path(".").resolve()
          snapshots = sorted((root / "backups").glob("git_runtime_snapshot_*.zip"))
          if not snapshots:
              raise SystemExit("No git_runtime_snapshot_*.zip found under backups/.")

          latest = snapshots[-1]
          print(f"Restoring runtime snapshot: {latest.name}")
          subprocess.run(
              [sys.executable, "python/restore_csv_md_zip.py", "--zip", str(latest), "--overwrite"],
              check=True,
          )
          with (root / "runtime_snapshot_env.txt").open("w", encoding="utf-8") as fh:
              fh.write("SCHEDULER_SKIP_PIPELINE=1\n")
              fh.write("OPS_REFRESH_USE_RUNTIME_SNAPSHOT=1\n")
          PY

      - name: Apply runtime snapshot environment
        if: ${{ env.LEE_EXECUTION_MODE == 'runtime_snapshot' }}
        run: cat runtime_snapshot_env.txt >> "$GITHUB_ENV"

      - name: Validate history depth before batch
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          ROOT = Path(".").resolve()
          checks = [
              ("data/prices_daily_adjusted.csv", 100000, "2024-01-01"),
              ("data/features.csv", 100000, "2024-01-01"),
              ("data/labels.csv", 50000, "2024-01-01"),
          ]
          failures = []

          for rel_path, min_rows, max_min_date in checks:
              path = ROOT / rel_path
              if not path.exists():
                  failures.append(f"{rel_path}: file missing")
                  continue
              rows = 0
              min_date = None
              with path.open("r", encoding="utf-8-sig", newline="") as fh:
                  reader = csv.DictReader(fh)
                  for row in reader:
                      rows += 1
                      date_value = (row.get("date") or "").strip()
                      if date_value and (min_date is None or date_value < min_date):
                          min_date = date_value
              print(f"{rel_path}: rows={rows}, min_date={min_date}")
              if rows < min_rows:
                  failures.append(f"{rel_path}: rows {rows} < {min_rows}")
              if not min_date:
                  failures.append(f"{rel_path}: min_date missing")
              elif min_date > max_min_date:
                  failures.append(f"{rel_path}: min_date {min_date} is later than {max_min_date}")

          if failures:
              print("History depth validation failed:")
              for item in failures:
                  print(f" - {item}")
              raise SystemExit(1)
          print("History depth validation passed.")
          PY

      - name: Run close batch
        run: >
          python python/run_scheduled_job.py
          --command-set close
          --daily-time 16:00
          --trigger-source github_actions

      - name: Save scheduler state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/history
            data/dart
            data/fundamentals.csv
            data/prices_daily_raw.csv
            data/prices_daily_clean.csv
            data/prices_daily_adjusted.csv
            data/features.csv
            data/labels.csv
            data/universe.csv
            data/ranking_snapshot_archive.csv
            data/live_account_holdings.csv
            data/paper_trading_nav.csv
            data/score_kpi_monitor.json
            data/confidence_score_v2.json
            outputs/auto_ops_scheduler_status.json
            outputs/auto_ops_recovery_scheduler_status.json
            serving
          key: ${{ runner.os }}-lee-trader-state-${{ github.run_id }}

      - name: Upload comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: close-batch-output-${{ github.run_id }}
          path: |
            data/ranking_final.csv
            data/predictions.csv
            data/features.csv
            data/labels.csv
            data/universe.csv
            data/prices_daily_adjusted.csv
            data/market_status.csv
            data/quality.csv
            output/stock_theme_daily.csv
          if-no-files-found: warn
