name: Close Flow Batch

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lee-trader-close-flow-batch
  cancel-in-progress: false

jobs:
  close-flow-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Seoul
      MARKET_TIMEZONE: Asia/Seoul
      ENABLE_FLOW_INGESTION: "0"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KIS_BASE_URL: ${{ secrets.KIS_BASE_URL }}
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
      NAVER_FALLBACK_VERIFY_SSL: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: python/requirements.txt

      - name: Restore scheduler state cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/ranking_snapshot_archive.csv
            data/live_account_holdings.csv
            data/paper_trading_nav.csv
            data/score_kpi_monitor.json
            data/confidence_score_v2.json
            outputs
            serving
            output
          key: ${{ runner.os }}-lee-trader-state-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-lee-trader-state-

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Install Python packages
        run: python -m pip install --upgrade pip && pip install -r python/requirements.txt

      - name: Run close flow batch
        run: python python/run_flow_ingestion_batch.py

      - name: Save scheduler state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/history
            data/ranking_snapshot_archive.csv
            data/live_account_holdings.csv
            data/paper_trading_nav.csv
            data/score_kpi_monitor.json
            data/confidence_score_v2.json
            outputs
            serving
            output
          key: ${{ runner.os }}-lee-trader-state-${{ github.run_id }}
